e:13px;margin-bottom:3px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:22px}.quick button{display:flex;text-align:left;align-items:center;gap:15px;padding:20px;background:white;border:1px solid var(--line);border-radius:13px}.icon{width:43px;height:43px;display:grid;place-items:center;background:#edf4e9;border-radius:11px;font-size:23px;flex-shrink:0}.quick strong{display:block;font-size:14px}.quick small{color:var(--muted);display:block;margin-top:6px;font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:30px 0 18px}.sectionhead h2{font-size:20px;letter-spacing:-.5px;margin:0}.textbtn{background:none;color:var(--green);font-size:12px}.categories{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.chip{border:1px solid var(--line);background:white;color:var(--muted);border-radius:20px;padding:9px 16px;font-size:12px}.chip.on{background:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.product-art{height:125px;background:#f1f4eb;display:grid;place-items:center}.minipack{background:#fff;width:100px;height:62px;transform:rotate(-9deg);box-shadow:6px 9px 12px #233b3020;border-left:22px solid var(--tone,#8aa275);padding:10px 6px;font-size:9px;color:#718071}.minipack b{display:block;color:var(--ink);font-size:12px}.cardbody{padding:16px}.cardbody small{font-size:10px;color:var(--muted)}h3{font-size:14px;margin:8px 0}.pricebar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:700;font-size:14px}.add{border-radius:7px;background:#edf5ef;color:var(--green);padding:8px 11px}.docphoto{height:105px;background:#e5eee8;display:grid;place-items:center;font-size:55px}.status{color:var(--green);font-size:11px;background:#edf5ef;padding:5px 8px;border-radius:5px}.notice{font-size:11px;margin-top:28px;color:#86958d}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:23px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row p{font-size:12px}.empty{padding:55px 20px;text-align:center}.empty h2{margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.stats .panel{margin:0}.stats strong{display:block;font-size:28px;margin-top:12px}.steps{display:flex;justify-content:space-between;margin:25px 0;gap:9px}.step{font-size:11px;color:#87968e;border-top:4px solid #e6ede7;padding-top:12px;flex:1}.step.done{border-color:var(--green);color:var(--green)}dialog{width:min(520px,94vw);border:0;border-radius:20px;padding:29px;color:var(--ink);box-shadow:0 30px 100px #133c3330}dialog::backdrop{background:#133c3360;backdrop-filter:blur(3px)}dialog h2{margin:5px 0 12px}label{display:block;margin:16px 0 7px;font-size:12px;font-weight:600}input:not(.search),textarea{width:100%;padding:12px;border:1px solid #dbe6dd;border-radius:8px;color:var(--ink);background:white}dialog select{width:100%}.close{float:right;background:#eef3ef;border-radius:50%;padding:7px 11px}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#173e33;color:white;padding:15px 25px;border-radius:10px;z-index:20;box-shadow:0 5px 30px #0002}.progress{height:8px;background:#edf2ec;border-radius:5px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:#64a185}.map{height:160px;border-radius:10px;position:relative;background:repeating-linear-gradient(30deg,transparent 0 35px,#fff 36px 44px,transparent 45px 90px),repeating-linear-gradient(110deg,#e9efdf 0 50px,#fff 51px 58px,#e9efdf 59px 100px);display:grid;place-items:center;color:var(--green);font-weight:bold}.map span{background:white;border-radius:8px;padding:12px}.mobilebar{display:none}@media(min-width:1450px){main{margin:auto auto auto 230px}}@media(max-width:1100px){aside{width:195px;padding:30px 15px}main{margin-left:195px;padding:0 24px 35px}.grid{grid-template-columns:repeat(3,1fr)}.hero h2{font-size:32px}.search{width:230px}.quick button{padding:14px;gap:10px}.quick small{font-size:10px}.profile .name{display:none}}@media(max-width:760px){aside{display:none}main{margin:0;padding:0 18px 100px}header{height:80px}.greeting{display:block;margin:24px 0 20px}h1{font-size:25px}.search{width:100%;margin-top:17px}.hero{grid-template-columns:1.2fr .8fr;min-height:265px}.hero-copy{padding:25px 20px}.hero h2{font-size:29px}.hero p{font-size:12px}.hero-art{overflow:hidden}.bottle{transform:rotate(-13deg) scale(.8);margin-left:10px;flex-shrink:0}.pack{display:none}.floating{display:none}.quick{gap:8px}.quick button{display:block;padding:13px 10px}.quick .icon{margin-bottom:12px;width:34px;height:34px;font-size:18px}.quick strong{font-size:11px}.quick small{font-size:9px;line-height:1.5}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.profile{gap:6px}.demo{font-size:8px}.avatar{display:none}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:12px 3px 20px;z-index:5}.mobilebar button{background:none;color:var(--muted);font-size:11px;padding:8px}.mobilebar .active{color:var(--green);font-weight:bold}.name{display:none}.sectionhead h2{font-size:18px}}
</style></head><body><aside><div class="logo"><b>+</b>ABI<span> Med</span><small style="display:block;font-size:11px;letter-spacing:2px;margin:9px 0 0 43px">DELIVERY</small></div><div class="tag">CARE THAT COMES TO YOU</div><nav id="nav"></nav><div class="sidecard"><strong>A little care, a big difference.</strong>Your medicines and appointments, all in one place.<button onclick="upload()">Upload prescription ↗</button></div><p style="font-size:10px;margin-top:20px">Nigeria · Client preview v1.0</p></aside><main><header><div class="location"><small>Delivering to</small><select id="city" aria-label="Delivery city"><option>Lagos, Nigeria</option><option>Abuja, Nigeria</option><option>Port Harcourt, Nigeria</option><option>Ibadan, Nigeria</option><option>Kano, Nigeria</option></select></div><div class="profile"><span class="demo">INTERACTIVE DEMO</span><select id="role" aria-label="View role" onchange="roleChange(this.value)"><option>Customer</option><option>Pharmacy</option><option>Doctor</option><option>Delivery</option><option>Admin</option></select><div class="avatar">AJ</div></div></header><div id="app"></div></main><div class="mobilebar" id="mobile"></div><dialog id="modal"></dialog><div id="toast" hidden class="toast" role="status"></div><script>
const $=s=>document.querySelector(s),money=n=>'₦'+n.toLocaleString();let page='Home',category='All',query='',role='Customer';let cart=JSON.parse(localStorage.getItem('wm-cart')||'[]'),orders=JSON.parse(localStorage.getItem('wm-orders')||'[]'),bookings=JSON.parse(localStorage.getItem('wm-bookings')||'[]'),rx=JSON.parse(localStorage.getItem('wm-rx')||'[]');
const products=[{id:1,name:'Vitamin C 1000mg',type:'Vitamins',price:4500,detail:'30 tablets · Wellness',tone:'#e9ba6f'},{id:2,name:'Digital thermometer',type:'Devices',price:6500,detail:'1 device · Home care',tone:'#8eb6bc'},{id:3,name:'First aid essentials',type:'First aid',price:8200,detail:'12-piece kit · Home care',tone:'#b68383'},{id:4,name:'Vitamin D3',type:'Vitamins',price:3800,detail:'30 capsules · Wellness',tone:'#93a98b'},{id:5,name:'Oral rehydration salts',type:'Wellness',price:1200,detail:'5 sachets · Pharmacy',tone:'#a0b8cd'},{id:6,name:'Blood pressure monitor',type:'Devices',price:28500,detail:'1 device · Home care',tone:'#a29bbb'},{id:7,name:'Sterile dressings',type:'First aid',price:2400,detail:'10 dressings · Home care',tone:'#92b8aa'},{id:8,name:'Multivitamin daily',type:'Wellness',price:5200,detail:'30 tablets · Wellness',tone:'#dfb08c'}];
const doctors=[{id:1,name:'Dr. Amara Okafor',specialty:'General practitioner',fee:12000,emoji:'👩🏾‍⚕️',experience:'8 years',rating:'4.9'},{id:2,name:'Dr. Tunde Adeyemi',specialty:'Paediatrician',fee:18000,emoji:'👨🏾‍⚕️',experience:'12 years',rating:'4.9'},{id:3,name:'Dr. Zainab Bello',specialty:'Dermatologist',fee:20000,emoji:'👩🏽‍⚕️',experience:'10 years',rating:'4.8'},{id:4,name:'Dr. Chidi Eze',specialty:'Cardiologist',fee:25000,emoji:'👨🏿‍⚕️',experience:'15 years',rating:'4.9'}];
function save(){localStorage.setItem('wm-cart',JSON.stringify(cart));localStorage.setItem('wm-orders',JSON.stringify(orders));localStorage.setItem('wm-bookings',JSON.stringify(bookings));localStorage.setItem('wm-rx',JSON.stringify(rx))}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}function openModal(html){$('#modal').innerHTML='<button class="close" onclick="this.closest(\'dialog\').close()" aria-label="Close">×</button>'+html;$('#modal').showModal()}function go(p){page=p;render();window.scrollTo(0,0)}function roleChange(v){role=v;page=v==='Customer'?'Home':'Dashboard';render()}function navigation(){let names=role==='Customer'?['Home','Medicines','Doctors','My orders','Appointments','Cart']:['Dashboard','Orders','Appointments'];let icons=['⌂','✚','♧','▤','◷','▢'];let html=names.map((n,i)=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${icons[i]} &nbsp; ${n}${n==='Cart'&&cart.length?' ('+cart.reduce((s,c)=>s+c.qty,0)+')':''}</button>`).join('');$('#nav').innerHTML=html;$('#mobile').innerHTML=html}function title(h,p){return `<div class="greeting"><div><h1>${h}</h1><p>${p}</p></div>${['Home','Medicines','Doctors'].includes(page)?'<input class="search" aria-label="Search" placeholder="⌕  Search medicines or doctors…" oninput="search(this.value)" value="'+safe(query)+'">':''}</div>`}function search(v){query=v;let el=$('#results');if(el)el.innerHTML=page==='Doctors'?doctorCards():productCards(page==='Home'?4:8)}function productCards(limit=8){let list=products.filter(p=>(category==='All'||p.type===category)&&(p.name+' '+p.type).toLowerCase().includes(query.toLowerCase())).slice(0,limit);return list.length?list.map(p=>`<article class="card"><div class="product-art" style="--tone:${p.tone}"><div class="minipack"><b>${p.name}</b>ABI Med delivery care</div></div><div class="cardbody"><small>${p.type.toUpperCase()}</small><h3>${p.name}</h3><small>${p.detail}</small><div class="pricebar">${money(p.price)}<button class="add" onclick="add(${p.id})" aria-label="Add ${p.name}">＋</button></div></div></article>`).join(''):'<p>No matching products. Try another search.</p>'}function doctorCards(){let list=doctors.filter(d=>(d.name+' '+d.specialty).toLowerCase().includes(query.toLowerCase()));return list.length?list.map(d=>`<article class="card"><div class="docphoto">${d.emoji}</div><div class="cardbody"><small>★ ${d.rating} · Sample profile</small><h3>${d.name}</h3><p style="font-size:12px">${d.specialty} · ${d.experience}</p><div class="pricebar">${money(d.fee)}<button class="add" onclick="book(${d.id})">Book ↗</button></div></div></article>`).join(''):'<p>No matching doctors.</p>'}
function render(){navigation();let h='';if(role!=='Customer'){dashboard();return}if(page==='Home')h=title('Good day, welcome to ABI Med delivery 👋','A healthier day starts with a little care.')+`<section class="hero"><div class="hero-copy"><span class="eyebrow">Your everyday health companion</span><h2>Your health.<br>One less thing<br>to worry about.</h2><p>Medicines to your doorstep. The right doctor at your fingertips.</p><button class="primary" onclick="go('Medicines')">Explore medicines &nbsp; ↗</button></div><div class="hero-art"><div class="bottle"><div class="bottle-label">ABI Med delivery<br><b>daily care</b><br>VITAMIN C</div></div><div class="pack">ABI Med delivery<strong>A little<br>daily boost.</strong>VITAMIN D3<br>30 CAPSULES</div><div class="floating"><b>✦ Care, wherever you are</b>Delivery and appointments across Nigeria</div></div></section><div class="quick"><button onclick="upload()"><span class="icon">↥</span><div><strong>Upload prescription</strong><small>Let a pharmacy prepare your order ↗</small></div></button><button onclick="go('Doctors')"><span class="icon" style="background:#f4eee3">♧</span><div><strong>Book a doctor</strong><small>Find the right care for you ↗</small></div></button><button onclick="go('My orders')"><span class="icon" style="background:#eaf0f5">▧</span><div><strong>Track your order</strong><small>Stay updated, every step ↗</small></div></button></div><div class="sectionhead"><h2>Everyday essentials</h2><button class="textbtn" onclick="go('Medicines')">View all medicines →</button></div><div class="grid" id="results">${productCards(4)}</div><div class="sectionhead"><h2>A doctor for every chapter</h2><button class="textbtn" onclick="go('Doctors')">Meet the doctors →</button></div><div class="grid">${doctorCards()}</div>`;
if(page==='Medicines')h=title('Your everyday essentials','Browse sample products from our demonstration pharmacy.')+`<div class="categories">${['All','Vitamins','Wellness','Devices','First aid'].map(c=>`<button class="chip ${category===c?'on':''}" onclick="category='${c}';render()">${c}</button>`).join('')}<button class="chip" onclick="upload()">↥ Upload prescription</button></div><div class="grid" id="results">${productCards()}</div>`;
if(page==='Doctors')h=title('Find your kind of care','Choose a specialist and book a clinic, home or video appointment.')+`<div class="panel"><span class="status">Demonstration profiles</span><p style="font-size:12px;margin-top:10px">These profiles and available slots are illustrative. No real consultation is arranged.</p></div><div class="grid" id="results">${doctorCards()}</div>`;
if(page==='Cart')h=title('Your care basket','Review your items before placing a demo order.')+cartView();if(page==='My orders')h=title('Your orders, at a glance','Follow your demo medicine deliveries and prescription requests.')+orderView();if(page==='Appointments')h=title('Time for your health','Manage your upcoming demonstration appointments.')+appointmentView();$('#app').innerHTML=h+`<p class="notice">Client demonstration · Sample products, prices and providers · Changes are saved only in this browser. No real payments, prescriptions or medical services are processed.</p>`}
function add(id){let c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id,qty:1});save();navigation();toast('Added to your basket')}function quantity(id,n){let c=cart.find(x=>x.id===id);c.qty+=n;cart=cart.filter(x=>x.qty>0);save();render()}function total(){return cart.reduce((s,c)=>s+products.find(p=>p.id===c.id).price*c.qty,0)}function cartView(){if(!cart.length)return `<div class="panel empty"><h2>Your basket is ready for a little care.</h2><p>Explore our sample pharmacy to add your essentials.</p><button class="primary" style="margin-top:20px" onclick="go('Medicines')">Browse medicines</button></div>`;return `<div class="columns"><div class="panel">${cart.map(c=>{let p=products.find(p=>p.id===c.id);return `<div class="row"><div><h3>${p.name}</h3><p>${money(p.price)} each</p></div><div><button class="add" onclick="quantity(${p.id},-1)" aria-label="Decrease quantity">−</button> ${c.qty} <button class="add" onclick="quantity(${p.id},1)" aria-label="Increase quantity">+</button></div></div>`}).join('')}</div><div class="panel"><h3>Order summary</h3><div class="row">Subtotal <b>${money(total())}</b></div><div class="row">Demo delivery <b>₦1,500</b></div><div class="row">Total <b>${money(total()+1500)}</b></div><button class="primary" style="width:100%;margin-top:20px" onclick="checkout()">Continue to checkout →</button></div></div>`}
function checkout(){openModal(`<h2>A little care, on its way.</h2><p>Place a sample order. Please use fictional details.</p><form onsubmit="placeOrder(event)"><label for="field-customer">Recipient name</label><input id="field-customer" name="customer" required placeholder="Demo customer" maxlength="60"><label for="field-address">Delivery address</label><input id="field-address" name="address" required placeholder="12 Example Street" maxlength="150"><label for="field-fulfilment">Fulfilment</label><select id="field-fulfilment" name="fulfilment" onchange="document.getElementById('checkout-total').textContent=money(total()+(this.value==='Delivery'?1500:0))"><option>Delivery</option><option>Pharmacy pickup</option></select><label for="field-payment">Payment method</label><select id="field-payment" name="payment"><option>Cash on delivery (demo)</option><option>Card (simulated — no charge)</option><option>Wallet (simulated)</option></select><label for="field-notes">Delivery notes (optional)</label><textarea id="field-notes" name="notes" placeholder="Any helpful instructions" maxlength="200"></textarea><p style="font-size:12px;margin-top:14px">Total: <span id="checkout-total">${money(total()+1500)}</span> · No payment will be collected.</p><div class="modalfoot"><button class="primary" type="submit">Place demo order</button></div></form>`)}
function placeOrder(e){e.preventDefault();let f=new FormData(e.target);orders.unshift({id:'ABI-'+Date.now().toString().slice(-6),items:cart.map(c=>({...c})),total:total()+(f.get('fulfilment')==='Delivery'?1500:0),address:f.get('address'),city:$('#city').value,payment:f.get('payment'),fulfilment:f.get('fulfilment'),stage:0,date:new Date().toLocaleDateString('en-GB')});cart=[];save();$('#modal').close();go('My orders');toast('Demo order placed successfully')}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function orderView(){return (!orders.length&&!rx.length)?`<div class="panel empty"><h2>Your next delivery starts here.</h2><p>Once you place a demo order, you can follow its progress here.</p><button class="primary" style="margin-top:20px" onclick="go('Medicines')">Explore medicines</button></div>`:orders.map((o,i)=>`<div class="panel"><div class="row"><div><h3>${o.id}</h3><p>${o.date} · ${o.items.reduce((s,c)=>s+c.qty,0)} items · ${money(o.total)}</p></div><span class="status">${o.stage===-1?'Cancelled':['Order received','Pharmacy preparing','Out for delivery','Delivered'][o.stage]}</span></div><p style="font-size:12px;margin-top:12px">${safe(o.address)} · ${safe(o.city)} · ${safe(o.fulfilment)}</p>${o.stage>=0?`<div class="steps">${['Received','Preparing','On the way','Complete'].map((s,j)=>`<div class="step ${j<=o.stage?'done':''}">${s}</div>`).join('')}</div>${o.stage===2?'<div class="map"><span>◉ Demo courier location · Lagos</span></div>':''}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">${o.stage<3?`<button class="secondary" onclick="advance(${i})">Simulate next stage →</button>`:''}${o.stage===0?`<button class="textbtn" onclick="orders[${i}].stage=-1;save();render()">Cancel order</button>`:''}<button class="textbtn" onclick="invoice(${i})">View invoice</button></div>`:''}</div>`).join('')+rx.map(r=>`<div class="panel"><h3>Prescription request · ${safe(r.id)}</h3><p>${safe(r.file)} · ${safe(r.store)}</p><span class="status">Awaiting pharmacy review · Demo only</span></div>`).join('')}
function advance(i){orders[i].stage=Math.min(3,orders[i].stage+1);save();render()}function invoice(i){let o=orders[i];openModal(`<h2>Demo invoice</h2><p>${o.id} · ${o.date}</p>${o.items.map(c=>{let p=products.find(p=>p.id===c.id);return `<div class="row">${p.name} × ${c.qty}<b>${money(p.price*c.qty)}</b></div>`}).join('')}<div class="row">${o.fulfilment==='Delivery'?'Delivery':'Pickup'}<b>${o.fulfilment==='Delivery'?'₦1,500':'Free'}</b></div><div class="row">Total<b>${money(o.total)}</b></div><p style="font-size:12px">${safe(o.payment)} · Demonstration invoice, no payment made.</p>`)}
function upload(){openModal(`<h2>Let the pharmacy help.</h2><p>Upload a sample prescription for a demo review. Use a blank or fictional document.</p><form onsubmit="submitRx(event)"><label for="field-file">Choose a sample document</label><input id="field-file" name="file" type="file" accept="image/*,.pdf" required><label for="field-store">Choose pharmacy</label><select id="field-store" name="store"><option>ABI Med delivery Demo Pharmacy · Lagos</option><option>ABI Med delivery Demo Pharmacy · Abuja</option><option>ABI Med delivery Demo Pharmacy · Port Harcourt</option></select><p style="font-size:12px;margin-top:16px">Only the filename is stored in this browser. No file is uploaded or reviewed by a real pharmacist.</p><div class="modalfoot"><button class="primary">Submit demo request</button></div></form>`)}function submitRx(e){e.preventDefault();let f=new FormData(e.target),file=f.get('file');if(file.size>10*1024*1024){toast('Please choose a file under 10 MB');return}rx.unshift({id:'RX-'+Date.now().toString().slice(-6),file:file.name,store:f.get('store')});save();$('#modal').close();go('My orders');toast('Demo prescription request created')}
function book(id){let d=doctors.find(x=>x.id===id),date=new Date();date.setDate(date.getDate()+1);let min=date.toISOString().slice(0,10);openModal(`<h2>Make time for your health.</h2><p>${d.name} · ${d.specialty}</p><form onsubmit="confirmBooking(event,${id})"><label for="field-date">Appointment date</label><input id="field-date" name="date" type="date" min="${min}" value="${min}" required><label for="field-time">Available sample times</label><select id="field-time" name="time"><option>09:00</option><option>10:30</option><option>12:00</option><option>14:30</option><option>16:00</option></select><label for="field-type">Consultation type</label><select id="field-type" name="type"><option>Video consultation</option><option>Clinic visit</option><option>Home visit</option></select><label for="field-patient">Patient name</label><input id="field-patient" name="patient" placeholder="Use a fictional name" required maxlength="60"><p style="font-size:12px;margin-top:17px">Sample consultation fee: ${money(d.fee)}. No real booking or charge is made.</p><div class="modalfoot"><button class="primary">Confirm demo appointment</button></div></form>`)}function confirmBooking(e,id){e.preventDefault();let f=new FormData(e.target);if(bookings.some(b=>b.doctor===id&&b.date===f.get('date')&&b.time===f.get('time')&&b.status!=='Cancelled')){toast('That sample slot is already booked. Choose another time.');return}bookings.unshift({id:'APT-'+Date.now().toString().slice(-6),doctor:id,date:f.get('date'),time:f.get('time'),type:f.get('type'),status:'Confirmed'});save();$('#modal').close();go('Appointments');toast('Demo appointment confirmed')}
function appointmentView(){return bookings.length?bookings.map((b,i)=>{let d=doctors.find(x=>x.id===b.doctor);return `<div class="panel"><div class="row"><div><h3>${d.emoji} ${d.name}</h3><p>${d.specialty} · ${b.id}</p></div><span class="status">${b.status}</span></div><div class="row"><p>${b.date} at ${b.time}<br>${b.type} · ${money(d.fee)}</p>${b.status==='Confirmed'?`<button class="secondary" onclick="bookings[${i}].status='Cancelled';save();render();toast('Demo appointment cancelled')">Cancel booking</button>`:''}</div></div>`}).join(''):`<div class="panel empty"><h2>Your next step to feeling better.</h2><p>Choose a doctor to create your first sample appointment.</p><button class="primary" style="margin-top:20px" onclick="go('Doctors')">Find a doctor</button></div>`}
function dashboard(){let titleMap={Admin:'A clear view of your care network.',Pharmacy:'Your pharmacy, in good hands.',Doctor:'Your day of care, organised.',Delivery:'Ready for your next delivery?'};let h=title(role+' workspace',titleMap[role])+`<div class="panel"><span class="status">${role} demonstration</span><p style="font-size:12px;margin-top:10px">Sample operations workspace. Customer actions in this browser appear here. This role switch demonstrates the interface and is not an authentication system.</p></div>`;if(page==='Appointments'){h+=appointmentView()}else if(page==='Orders'){h+=orderView()}else{h+=`<div class="stats">${[[role==='Doctor'?'Appointments':'Orders',role==='Doctor'?bookings.length:orders.length],['Prescription requests',rx.length],['Completed',orders.filter(o=>o.stage===3).length],['Order value',money(orders.filter(o=>o.stage>=0).reduce((s,o)=>s+o.total,0))]].map(x=>`<div class="panel"><p style="font-size:12px">${x[0]}</p><strong>${x[1]}</strong></div>`).join('')}</div><div class="sectionhead"><h2>${role==='Doctor'?'Appointment schedule':'Live order activity'}</h2>${role==='Admin'?'<button class="secondary" onclick="exportCSV()">Export report ↓</button>':''}</div>${role==='Doctor'?appointmentView():orderView()}`;if(role==='Admin'||role==='Pharmacy')h+=`<div class="panel"><h3>Sample provider network</h3>${['ABI Med delivery Demo Pharmacy · Lagos','ABI Med delivery Demo Pharmacy · Abuja','ABI Med delivery Demo Clinic · Port Harcourt'].map(n=>`<div class="row"><span>${n}</span><span class="status">Sample provider</span></div>`).join('')}</div>`}$('#app').innerHTML=h}
function exportCSV(){let rows=[['Order','Date','Status','Total NGN'],...orders.map(o=>[o.id,o.date,o.stage===-1?'Cancelled':['Received','Preparing','Out for delivery','Delivered'][o.stage],o.total])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='abi-med-delivery-orders.csv';a.click();URL.revokeObjectURL(a.href);toast('Demo report exported')}render();
</script></body></html>
